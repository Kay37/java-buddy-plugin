# Used by "mvn exec:exec@run-ide": gives the test IDE its own settings, caches and plugins,
# so it never touches your normal IntelliJ setup. Must match <sandbox.dir> in pom.xml.
idea.config.path=${user.home}/.idea-sandbox/java-buddy/config
idea.system.path=${user.home}/.idea-sandbox/java-buddy/system
idea.plugins.path=${user.home}/.idea-sandbox/java-buddy/plugins
idea.log.path=${user.home}/.idea-sandbox/java-buddy/log
